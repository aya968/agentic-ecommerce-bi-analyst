services:
  api:
    image: ecommerce-ai-analyst:local
    build:
      context: .
    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATA_DIR: /data
      DB_PATH: /data/ecommerce.db
      UPLOAD_DIR: /data/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
      GEMINI_RETRY_DELAY_SECONDS: ${GEMINI_RETRY_DELAY_SECONDS:-1}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ecommerce-analyst-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  streamlit:
    image: ecommerce-ai-analyst:local
    build:
      context: .
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      DATA_DIR: /data
      DB_PATH: /data/ecommerce.db
      UPLOAD_DIR: /data/uploads
      API_BASE_URL: http://api:8000
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ecommerce-analyst-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  ecommerce-analyst-data:
